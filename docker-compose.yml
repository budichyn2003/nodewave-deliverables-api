services:
  postgres:
    image: postgres:17-alpine
    container_name: deliverables-postgres
    environment:
      POSTGRES_USER: deliverables
      POSTGRES_PASSWORD: deliverables
      POSTGRES_DB: deliverables
    ports:
      - "5432:5432"
    volumes:
      - deliverables_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliverables"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  deliverables_pgdata:
